<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot - 1-Min Video Reviews & AI Platform</title>
    <script>
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var suffix = (window.location.search || '') + (window.location.hash || '');
        var target = './' + suffix;
        if (window.location.hostname.endsWith('github.io') && pathSegments.length >= 1) {
          target = '/' + pathSegments[0] + '/' + suffix;
        }
        if (window.location.pathname + suffix !== target) {
          window.location.replace(target);
        }
      })();
    </script>
  </head>
  <body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F2EC;color:#17171A;font-family:system-ui,-apple-system,sans-serif;">
    <p style="font-size:14px;font-weight:600;">Redirecting to Dot...</p>
  </body>
</html>
